[package]
name = "loki-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI over the DeckCraft engine for the Loki Decks Kotlin Multiplatform front end"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
deckcraft-mcp = { path = "../../crates/mcp" }
deckcraft-engine = { path = "../../crates/engine" }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
